<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO HOST — Cloud Hosting Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); }
    </style>
</head>
<body class="bg-[#07090E] text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black">

    <header class="glass sticky top-0 z-50 px-6 py-4 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center glow">
                <i data-lucide="cloud-lightning" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">AERO HOST</span>
                <span class="text-xs block text-slate-400 mono">v3.5 Cloud Platform</span>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="openDeployModal()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-bold px-5 py-2.5 rounded-xl shadow-lg transition-all transform hover:scale-105 flex items-center space-x-2 text-sm">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>ახალი საიტის დაპლოვება</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <div class="space-y-6">
            <div class="glass p-6 rounded-2xl border border-slate-800/80">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">პლატფორმის სტატისტიკა</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-400 text-sm">სულ ჰოსტები:</span>
                        <span id="total-sites" class="mono font-bold text-cyan-400">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-400 text-sm">სტატუსი:</span>
                        <span class="mono text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded">Online</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold flex items-center space-x-2">
                    <i data-lucide="globe" class="w-5 h-5 text-cyan-400"></i>
                    <span>აქტიური საიტები პლატფორმაზე</span>
                </h2>
            </div>

            <div id="sites-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

            <div id="empty-state" class="hidden text-center py-16 glass rounded-2xl border border-dashed border-slate-800">
                <i data-lucide="folder-open" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
                <h3 class="text-lg font-medium text-slate-300">ჯერ საიტები არ არის</h3>
                <p class="text-sm text-slate-500 mt-1">შექმენი შენი საიტი დომენით!</p>
            </div>
        </div>
    </main>

    <div id="deploy-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass max-w-lg w-full p-6 rounded-3xl border border-slate-700 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold flex items-center space-x-2">
                    <i data-lucide="code" class="w-5 h-5 text-cyan-400"></i>
                    <span>საიტის შექმნა და დომენი</span>
                </h3>
                <button onclick="closeDeployModal()" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="deploy-form" onsubmit="handleDeploy(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">სასურველი სახელი (დომენი)</label>
                    <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl overflow-hidden focus-within:border-cyan-500">
                        <input type="text" id="site-slug" required placeholder="მაგ: my-site" class="w-full bg-transparent px-4 py-2.5 text-sm focus:outline-none text-white">
                        <span class="px-3 text-xs mono text-cyan-400 bg-slate-800/80 py-3 border-l border-slate-700">.mrx</span>
                    </div>
                    <span class="text-[10px] text-slate-500 mt-1 block">გამოიყენე მხოლოდ ლათინური ასოები და ტირე (-)</span>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">HTML / CSS კოდი</label>
                    <textarea id="site-code" rows="6" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm mono focus:outline-none focus:border-cyan-500 text-cyan-300">&lt;h1&gt;გამარჯობა მსოფლიო!&lt;/h1&gt;</textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition-all">
                    საიტის გაშვება (Deploy)
                </button>
            </form>
        </div>
    </div>

    <div id="preview-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex flex-col">
        <div class="glass px-6 py-3 flex justify-between items-center border-b border-slate-800">
            <span id="preview-title" class="font-bold text-sm text-slate-200">საიტის გადახედვა</span>
            <button onclick="closePreviewModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-1.5 rounded-lg text-xs font-semibold">დახურვა</button>
        </div>
        <div class="flex-1 bg-white">
            <iframe id="preview-iframe" class="w-full h-full border-none"></iframe>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let sites = JSON.parse(localStorage.getItem('aero_sites_v2')) || [];

        function saveSites() {
            localStorage.setItem('aero_sites_v2', JSON.stringify(sites));
            renderSites();
        }

        function renderSites() {
            const container = document.getElementById('sites-container');
            const emptyState = document.getElementById('empty-state');
            document.getElementById('total-sites').innerText = sites.length;

            if (sites.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = sites.map((site, index) => `
                <div class="glass p-5 rounded-2xl border border-slate-800 flex flex-col justify-between hover:border-cyan-500/50 transition-all">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-base text-slate-200">${site.slug}.mrx</h4>
                        </div>
                        <p class="text-xs text-cyan-400 mono mb-4">/${site.slug}</p>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-slate-800/80">
                        <button onclick="previewSite('${site.slug}')" class="text-xs bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 px-3 py-1.5 rounded-lg font-semibold flex items-center space-x-1">
                            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                            <span>ნახვა</span>
                        </button>
                        <button id="copy-btn-${index}" onclick="copyDomainLink('${site.slug}', ${index})" class="text-xs bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 px-3 py-1.5 rounded-lg font-semibold flex items-center space-x-1">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span>ლინკი</span>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function openDeployModal() { document.getElementById('deploy-modal').classList.remove('hidden'); }
        function closeDeployModal() { document.getElementById('deploy-modal').classList.add('hidden'); }

        function handleDeploy(e) {
            e.preventDefault();
            let slug = document.getElementById('site-slug').value.toLowerCase().replace(/[^a-z0-9-]/g, '');
            const code = document.getElementById('site-code').value;

            if (!slug) {
                alert("გთხოვთ შეიყვანოთ სწორი სახელი!");
                return;
            }

            // შემოწმება ხომ არ არსებობს უკვე ასეთი სახელი
            if (sites.some(s => s.slug === slug)) {
                alert("ეს სახელი დაკავებულია! სცადე სხვა.");
                return;
            }

            const newSite = {
                slug: slug,
                code: encodeURIComponent(btoa(unescape(encodeURIComponent(code))))
            };

            sites.unshift(newSite);
            saveSites();
            closeDeployModal();
            document.getElementById('deploy-form').reset();
        }

        function previewSite(slug) {
            const site = sites.find(s => s.slug === slug);
            if (!site) return;
            const decodedCode = decodeURIComponent(escape(window.atob(decodeURIComponent(site.code))));
            document.getElementById('preview-title').innerText = site.slug + ".mrx — Preview";
            document.getElementById('preview-iframe').srcdoc = decodedCode;
            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').classList.add('hidden');
            document.getElementById('preview-iframe').srcdoc = '';
        }

        function copyDomainLink(slug, index) {
            const fullUrl = window.location.origin + window.location.pathname + "#/site/" + slug;
            navigator.clipboard.writeText(fullUrl);
            
            const btn = document.getElementById(`copy-btn-${index}`);
            const originalText = btn.innerHTML;
            btn.innerHTML = "<span>დაკოპირდა!</span>";
            setTimeout(() => {
                btn.innerHTML = originalText;
                lucide.createIcons();
            }, 1500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash;
            if (hash.startsWith('#/site/')) {
                const slug = hash.replace('#/site/', '');
                // ვეძებთ საიტს ჯერ ლოკალურად, ან ვცდილობთ გამოვიტანოთ
                let foundSite = sites.find(s => s.slug === slug);
                if (foundSite) {
                    try {
                        const code = decodeURIComponent(escape(window.atob(decodeURIComponent(foundSite.code))));
                        document.open();
                        document.write(code);
                        document.close();
                        return;
                    } catch (err) {
                        console.error(err);
                    }
                }
            }
            renderSites();
        });
    </script>
</body>
</html>
