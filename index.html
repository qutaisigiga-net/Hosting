<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERO HOST — Cloud Hosting Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090e;--c:#22d3ee;--i:#6366f1;--t:#e2e8f0;--m:#94a3b8;--card:rgba(15,23,42,.72);--b:rgba(148,163,184,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
i[data-i]{display:inline-flex;vertical-align:middle}
#bg{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 18px 60px}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--b);border-radius:20px}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.logo{display:flex;align-items:center;gap:12px}
.logo b{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--c),var(--i));display:grid;place-items:center;color:#fff;box-shadow:0 0 28px rgba(34,211,238,.35)}
.grad{background:linear-gradient(90deg,var(--c),#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-weight:700;letter-spacing:.08em;font-size:18px}
.logo small{display:block;color:var(--m);font-size:11px}
.hero{text-align:center;padding:34px 0 26px}
.hero h1{font-size:clamp(30px,7vw,54px);line-height:1.1;margin:0 0 12px;font-weight:700}
.hero p{color:var(--m);margin:0 auto 22px;max-width:520px}
.cta{border:0;cursor:pointer;color:#04121a;font:700 15px 'Space Grotesk',sans-serif;padding:14px 26px;border-radius:14px;background:linear-gradient(90deg,var(--c),#3b82f6);display:inline-flex;gap:8px;align-items:center;box-shadow:0 8px 30px rgba(34,211,238,.3);transition:.2s}
.cta:hover{transform:translateY(-2px) scale(1.03)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{padding:16px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--c)}
.stat span{font-size:12px;color:var(--m)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.bar input[type=text],.bar input:not([type]){flex:1;min-width:150px}
input,textarea,select{background:rgba(2,6,23,.8);border:1px solid var(--b);color:var(--t);border-radius:12px;padding:11px 14px;font:inherit;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:var(--c)}
.btn{border:1px solid var(--b);background:rgba(30,41,59,.7);color:var(--t);cursor:pointer;font:600 12px 'Space Grotesk',sans-serif;padding:9px 12px;border-radius:10px;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.btn:hover{border-color:var(--c);color:var(--c)}
.btn.red:hover{border-color:#f87171;color:#f87171}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{overflow:hidden;transition:.25s;position:relative}
.card:hover{transform:translateY(-4px);border-color:rgba(34,211,238,.5);box-shadow:0 12px 40px rgba(34,211,238,.12)}
.thumb{height:140px;overflow:hidden;background:#fff;position:relative}
.thumb iframe{width:400%;height:400%;transform:scale(.25);transform-origin:0 0;border:0;pointer-events:none}
.card .in{padding:14px}
.card h4{margin:0 0 4px;font-size:16px;word-break:break-all}
.card .meta{display:flex;justify-content:space-between;color:var(--m);font-size:11px;margin-bottom:12px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.empty{text-align:center;padding:50px 20px;color:var(--m);border-style:dashed;display:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}
.sheet{background:#0b1120;border:1px solid var(--b);border-radius:22px;width:100%;max-width:660px;max-height:94vh;overflow:auto;padding:20px}
.sheet h3{margin:0;display:flex;align-items:center;gap:8px;font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.dom{display:flex;align-items:center;border:1px solid var(--b);border-radius:12px;background:rgba(2,6,23,.8);overflow:hidden}
.dom input{border:0;flex:1;background:transparent}
.dom span{padding:0 12px;color:var(--c);font-size:13px}
textarea{width:100%;color:#67e8f9;resize:vertical;font-family:'JetBrains Mono',monospace}
#preview-modal{padding:0;flex-direction:column;background:#000;align-items:stretch;justify-content:flex-start}
#preview-modal .top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#0b1120;border-bottom:1px solid var(--b);font-weight:600;font-size:14px}
#preview-iframe{flex:1;width:100%;border:0;background:#fff}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;background:#1e293b;border:1px solid var(--c);padding:10px 18px;border-radius:12px;font-size:14px;display:none;max-width:90vw}
.note{color:#64748b;font-size:11px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <nav>
    <div class="logo"><b><i data-i="bolt" data-s="22"></i></b><div><span class="grad">AERO HOST</span><small class="mono">v6.0 Cloud Platform</small></div></div>
    <button class="btn" id="new-top"><i data-i="plus"></i>ახალი</button>
  </nav>

  <section class="hero">
    <h1>გაუშვი საიტი <span class="grad">წამებში</span></h1>
    <p>ჩასვი HTML კოდი, აირჩიე სახელი და მიიღე ლინკი, რომელიც ყველგან იხსნება.</p>
    <button class="cta" id="new-btn"><i data-i="plus" data-s="18"></i>ახალი საიტის შექმნა</button>
  </section>

  <div class="stats">
    <div class="glass stat"><b id="total-sites" class="mono">0</b><span>საიტები</span></div>
    <div class="glass stat"><b id="total-size" class="mono">0 KB</b><span>ზომა</span></div>
    <div class="glass stat"><b class="mono" style="color:#34d399">● Online</b><span>სტატუსი</span></div>
  </div>

  <div class="bar">
    <input id="search" placeholder="ძებნა...">
    <button class="btn" id="export-btn"><i data-i="down"></i>ექსპორტი</button>
    <button class="btn" id="import-btn"><i data-i="up"></i>იმპორტი</button>
    <input id="import-file" type="file" accept=".json" hidden>
  </div>

  <div id="sites-container" class="grid"></div>
  <div id="empty-state" class="glass empty"><i data-i="globe" data-s="40"></i><h3>საიტები ვერ მოიძებნა</h3><p>შექმენი პირველი საიტი ზემოთ!</p></div>
  <p class="note mono">AERO HOST · Supabase + Netlify</p>
</div>

<div id="deploy-modal" class="modal"><div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3 id="modal-title"><i data-i="code" data-s="20"></i><span>საიტის შექმნა</span></h3>
    <button class="btn" id="close-modal"><i data-i="x"></i></button>
  </div>
  <form id="deploy-form">
    <div class="row"><div class="dom" style="flex:1"><input id="site-slug" required maxlength="40" placeholder="სახელი, მაგ: giorgi"><span class="mono">.mrx</span></div></div>
    <div class="row">
      <select id="template"><option value="">შაბლონი...</option><option value="hello">მარტივი</option><option value="card">პროფილი</option><option value="landing">Landing</option></select>
      <button type="button" class="btn" id="upload-btn"><i data-i="file"></i>.html ფაილი</button>
      <input id="html-file" type="file" accept=".html,.htm,text/html" hidden>
      <button type="button" class="btn" id="preview-btn" style="margin-left:auto"><i data-i="eye"></i>გადახედვა</button>
    </div>
    <textarea id="site-code" rows="11" required spellcheck="false"></textarea>
    <button type="submit" id="submit-btn" class="cta" style="width:100%;justify-content:center;margin-top:12px">გაშვება (Deploy)</button>
  </form>
</div></div>

<div id="preview-modal" class="modal">
  <div class="top"><span id="preview-title"></span><button class="btn" id="close-preview">დახურვა</button></div>
  <iframe id="preview-iframe" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');if(!t)return;t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
window.addEventListener('error',e=>toast('შეცდომა: '+e.message));

const KEY='aero_sites_v4';
const SB_URL='https://qknlueyiivdiiejbruns.supabase.co', SB_KEY='sb_publishable_UKW-rDxCOaPC4qmdmiTOZA_7D9TXlMY';
const DB=!SB_URL.startsWith('PASTE');
const H={apikey:SB_KEY,'Content-Type':'application/json'};

// ---- icons (inline, no external library) ----
const IC={plus:'M12 5v14M5 12h14',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6z',copy:'M9 9h11v11H9zM5 15H4V4h11v1',pencil:'M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',ext:'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6',down:'M12 4v12M7 11l5 5 5-5M4 20h16',up:'M12 16V4M7 9l5-5 5 5M4 20h16',x:'M6 6l12 12M18 6L6 18',bolt:'M13 2L4 14h7l-1 8 9-12h-7l1-8z',globe:'M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',code:'M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14',file:'M6 3h8l4 4v14H6zM14 3v4h4'};
const ic=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
const hydrate=()=>document.querySelectorAll('i[data-i]').forEach(e=>{e.innerHTML=ic(e.dataset.i,+e.dataset.s||16)});

// ---- helpers ----
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=t=>decodeURIComponent(escape(atob(decodeURIComponent(t))));
const tokens=()=>{try{return JSON.parse(localStorage.getItem('aero_tokens'))||{}}catch{return{}}};
const setToken=(k,t)=>{const o=tokens();if(t)o[k]=t;else delete o[k];localStorage.setItem('aero_tokens',JSON.stringify(o))};
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd=()=>hex(crypto.getRandomValues(new Uint8Array(24)));
async function sha(t){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t))))}
const bytes=s=>new Blob([s]).size, kb=n=>(n/1024).toFixed(1)+' KB';
const base=()=>location.origin+location.pathname;
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(!ts||s<60)return'ახლახანს';const m=Math.floor(s/60);if(m<60)return m+' წუთის წინ';const h=Math.floor(m/60);if(h<24)return h+' საათის წინ';return Math.floor(h/24)+' დღის წინ'}

// ---- database ----
async function dbGet(slug){const r=await fetch(SB_URL+'/rest/v1/sites?select=code&slug=eq.'+encodeURIComponent(slug),{headers:H});if(!r.ok)throw 0;const j=await r.json();return j[0]?j[0].code:null}
async function dbInsert(slug,code,token){const r=await fetch(SB_URL+'/rest/v1/sites',{method:'POST',headers:H,body:JSON.stringify({slug,code,owner_hash:await sha(token)})});return r.status}
async function dbRpc(fn,slug,token,code){const b={p_slug:slug,p_token_hash:await sha(token)};if(code!==undefined)b.p_code=code;return(await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(b)})).ok}

// ---- fallback links (code inside URL) ----
async function pack(str){const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());let s='';buf.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function unpack(t){const bin=atob(t.replace(/-/g,'+').replace(/_/g,'/'));const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(Uint8Array.from(bin,c=>c.charCodeAt(0)));w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())}
async function linkFor(site){return DB&&tokens()[site.slug]?location.origin+'/'+site.slug:base()+'#v='+await pack(site.code)}

// ---- local list (+ migration) ----
function load(){try{const v4=JSON.parse(localStorage.getItem(KEY));if(v4)return v4;const v3=JSON.parse(localStorage.getItem('aero_sites_v3'))||[];return v3.map(s=>{try{return{slug:s.slug,code:dec(s.code),createdAt:s.createdAt||Date.now()}}catch{return null}}).filter(Boolean)}catch{return[]}}
let sites=load(),editing=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(sites))}catch{toast('შენახვა ვერ მოხერხდა')}render()}

// ---- render ----
function render(){
  const q=$('search').value.trim().toLowerCase();
  const list=sites.filter(s=>s.slug.includes(q));
  $('total-sites').textContent=sites.length;
  $('total-size').textContent=kb(sites.reduce((a,s)=>a+bytes(s.code),0));
  $('empty-state').style.display=list.length?'none':'block';
  $('sites-container').innerHTML=list.map(s=>`
   <div class="glass card">
     <div class="thumb"><iframe sandbox="" loading="lazy" tabindex="-1" srcdoc="${esc(s.code)}"></iframe></div>
     <div class="in">
       <h4>${esc(s.slug)}.mrx</h4>
       <div class="meta mono"><span>${kb(bytes(s.code))}</span><span>${timeAgo(s.createdAt)}</span></div>
       <div class="acts" data-slug="${esc(s.slug)}">
         <button class="btn" data-act="view">${ic('eye',14)}ნახვა</button>
         <button class="btn" data-act="open">${ic('ext',14)}</button>
         <button class="btn" data-act="copy">${ic('copy',14)}ლინკი</button>
         <button class="btn" data-act="edit">${ic('pencil',14)}</button>
         <button class="btn red" data-act="del">${ic('trash',14)}</button>
       </div>
     </div>
   </div>`).join('');
}

$('sites-container').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const slug=b.parentElement.dataset.slug,site=sites.find(s=>s.slug===slug);if(!site)return;
  const act=b.dataset.act;
  if(act==='view')showPreview(site.code,site.slug+'.mrx');
  if(act==='open')window.open(await linkFor(site),'_blank');
  if(act==='copy'){const url=await linkFor(site);try{await navigator.clipboard.writeText(url);toast('ლინკი დაკოპირდა!')}catch{prompt('დააკოპირე:',url)}}
  if(act==='edit')openModal(site);
  if(act==='del'&&confirm(slug+'.mrx წაიშალოს?')){const t=tokens()[slug];if(DB&&t)await dbRpc('delete_site',slug,t);setToken(slug,null);sites=sites.filter(s=>s.slug!==slug);save();toast('წაიშალა')}
});

// ---- modal ----
const TPL={
 hello:'<h1>გამარჯობა მსოფლიო!</h1>',
 card:'<!DOCTYPE html><html><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;font-family:sans-serif;color:#fff"><div style="text-align:center;padding:40px;border-radius:24px;background:#1e293b"><div style="font-size:64px">👋</div><h1>შენი სახელი</h1><p style="color:#94a3b8">დეველოპერი · დიზაინერი</p></div></body></html>',
 landing:'<!DOCTYPE html><html><body style="margin:0;font-family:sans-serif;background:linear-gradient(135deg,#06b6d4,#6366f1);color:#fff;min-height:100vh;display:grid;place-items:center;text-align:center"><div><h1 style="font-size:48px;margin:0">ჩემი პროექტი</h1><p>მოკლე აღწერა აქ</p><a href="#" style="display:inline-block;margin-top:16px;padding:12px 28px;background:#fff;color:#4f46e5;border-radius:12px;text-decoration:none;font-weight:700">დაიწყე</a></div></body></html>'};
function openModal(site){
  editing=site||null;
  $('modal-title').querySelector('span').textContent=site?'რედაქტირება':'საიტის შექმნა';
  $('site-slug').value=site?site.slug:'';$('site-slug').disabled=!!site;
  $('site-code').value=site?site.code:TPL.hello;
  $('submit-btn').textContent=site?'შენახვა':'გაშვება (Deploy)';
  $('deploy-modal').classList.add('open');
}
const closeModal=()=>$('deploy-modal').classList.remove('open');
function showPreview(code,title){$('preview-title').textContent=title;$('preview-iframe').srcdoc=code;$('preview-modal').classList.add('open')}
$('new-btn').onclick=()=>openModal();
$('new-top').onclick=()=>openModal();
$('close-modal').onclick=closeModal;
$('close-preview').onclick=()=>{$('preview-modal').classList.remove('open');$('preview-iframe').srcdoc=''};
$('preview-btn').onclick=()=>showPreview($('site-code').value,'Live Preview');
$('template').onchange=e=>{if(TPL[e.target.value])$('site-code').value=TPL[e.target.value];e.target.value=''};
$('upload-btn').onclick=()=>$('html-file').click();
$('html-file').onchange=async e=>{const f=e.target.files[0];if(f){$('site-code').value=await f.text();toast('ფაილი ჩაიტვირთა')}e.target.value=''};
$('search').oninput=render;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('close-preview').click()}});

$('deploy-form').onsubmit=async e=>{
  e.preventDefault();
  const code=$('site-code').value;
  if(editing){
    editing.code=code;
    if(DB){const t=tokens()[editing.slug];
      if(t)await dbRpc('update_site',editing.slug,t,code);
      else{const nt=rnd(),st=await dbInsert(editing.slug,code,nt);if(st<300)setToken(editing.slug,nt);else toast('ეს სახელი ბაზაში დაკავებულია')}}
    save();closeModal();toast('განახლდა!');return;
  }
  const slug=$('site-slug').value.toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/^-+|-+$/g,'');
  if(!slug)return toast('გამოიყენე ლათინური ასოები, ციფრები ან -');
  if(sites.some(s=>s.slug===slug))return toast('ეს სახელი დაკავებულია!');
  if(DB){const t=rnd();let st;
    try{st=await dbInsert(slug,code,t)}catch{return toast('ბაზასთან კავშირი ვერ მოხერხდა')}
    if(st===409)return toast('ეს სახელი დაკავებულია!');
    if(st>=300)return toast('ბაზის შეცდომა ('+st+')');
    setToken(slug,t)}
  sites.unshift({slug,code,createdAt:Date.now()});
  save();closeModal();toast(slug+'.mrx გაშვებულია!');
};

// ---- backup ----
$('export-btn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sites,null,1)],{type:'application/json'}));a.download='aero-host-backup.json';a.click()};
$('import-btn').onclick=()=>$('import-file').click();
$('import-file').onchange=async e=>{
  try{const data=JSON.parse(await e.target.files[0].text());let n=0;
    data.forEach(s=>{if(s&&s.slug&&typeof s.code==='string'&&!sites.some(x=>x.slug===s.slug)){sites.push({slug:String(s.slug),code:s.code,createdAt:s.createdAt||Date.now()});n++}});
    save();toast(n+' საიტი დაემატა')}catch{toast('ფაილი არასწორია')}
  e.target.value='';
};

// ---- canvas background ----
function bgAnim(){
  const c=$('bg'),x=c.getContext('2d'),m={x:-999,y:-999};let W,Hh,PT=[];
  const rs=()=>{W=c.width=innerWidth;Hh=c.height=innerHeight;PT=Array.from({length:Math.min(75,W/13|0)},()=>({x:Math.random()*W,y:Math.random()*Hh,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45}))};
  addEventListener('resize',rs);addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});rs();
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function f(){
    x.clearRect(0,0,W,Hh);
    PT.forEach((p,i)=>{
      if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>Hh)p.vy*=-1}
      x.fillStyle='rgba(34,211,238,.75)';x.beginPath();x.arc(p.x,p.y,1.7,0,6.3);x.fill();
      for(let j=i+1;j<PT.length;j++){const q=PT[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<120){x.strokeStyle='rgba(99,102,241,'+(1-d/120)*.4+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}
      const dm=Math.hypot(p.x-m.x,p.y-m.y);if(dm<170){x.strokeStyle='rgba(34,211,238,'+(1-dm/170)*.55+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(m.x,m.y);x.stroke()}
    });
    requestAnimationFrame(f);
  })();
}

// ---- visitor viewer ----
function viewer(code,name){
  document.title=name||'AERO HOST';
  document.body.innerHTML='<iframe id="v" sandbox="allow-scripts allow-forms allow-popups allow-modals" style="position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff"></iframe><a href="'+location.origin+'/" style="position:fixed;right:10px;bottom:10px;font:600 11px sans-serif;background:rgba(7,9,14,.85);color:#22d3ee;padding:6px 10px;border-radius:10px;text-decoration:none;z-index:9">⚡ AERO HOST</a>';
  document.getElementById('v').srcdoc=code;
}
(async function init(){
  hydrate();
  if(location.hash.startsWith('#v=')){try{return viewer(await unpack(location.hash.slice(3)))}catch{}}
  const slug=decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,'').replace(/\.mrx$/,'').replace(/index\.html$/,'').toLowerCase();
  if(slug&&slug!=='srcdoc'&&/^[a-z0-9-]{1,40}$/.test(slug)){
    let code=null;
    if(DB){try{code=await dbGet(slug)}catch{}}
    if(code===null){const x=sites.find(y=>y.slug===slug);if(x)code=x.code}
    if(code!==null)return viewer(code,slug);
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:sans-serif;text-align:center;color:#fff"><div><h1>404</h1><p>'+esc(slug)+' ვერ მოიძებნა</p><a href="/" style="color:#22d3ee">მთავარი</a></div></div>';
    return;
  }
  try{bgAnim()}catch{}
  render();
})();
</script>
